name: Example Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        example:
          - defaults
          - inputs
          - install
          - refresh
          - status
          - cache
    steps:
      - uses: actions/checkout@v7
      - uses: tanaabased/actions/setup-node@v1
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Put built CLI on PATH
        run: echo "$PWD/dist" >> "$GITHUB_PATH"
      - name: Run Leia scenario
        run: |
          mkdir -p examples/.tmp
          tmpdir=$(cd examples/.tmp && pwd -P)
          TMPDIR="$tmpdir" bun run test:leia "examples/${{ matrix.example }}/README.md" --shell bash
