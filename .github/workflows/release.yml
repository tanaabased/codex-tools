name: Release
on:
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish-npm:
    name: Publish npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: tanaabased/actions/setup-node@v1
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run check:toolchain
          bun run lint
          bun run docs:check
          bun run typecheck
          bun run test
      - uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun --bun prettier .codex-plugin/plugin.json --write
      - run: bun run format:check && bun run build
      - id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Stage plugin
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          mkdir -p .temp/plugin
          tar -xzf "$TARBALL" -C .temp/plugin --strip-components=1
      - uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: .temp/plugin
      - name: Publish npm
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          channel-token: ${{ secrets.TANAAB_NPM_DEPLOY }}

  publish-repo:
    name: Publish repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish repo
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun --bun prettier .codex-plugin/plugin.json --write
          sync-branch: main
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
      - run: bun run format:check
