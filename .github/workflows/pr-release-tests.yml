name: Release Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  release-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tanaabased/actions/setup-node@v1
      - uses: tanaabased/actions/setup-bun@v1
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: 'true'
          version: v0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_attempt }}
          release-date: ${{ github.event.pull_request.updated_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun --bun prettier .codex-plugin/plugin.json --write
      - run: bun run format:check && bun run build
      - id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Verify packed consumers
        uses: tanaabased/actions/run-leia@v1
        env:
          CODEX_TOOLS_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
          LEIA_TIMEOUT: '120'
        with:
          scenarios: examples/package/README.md
          shell: bash
          retry: 0
          stdin: false
      - name: Stage plugin
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          mkdir -p .temp/plugin
          tar -xzf "$TARBALL" -C .temp/plugin --strip-components=1
      - uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: .temp/plugin
      - uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          dry-run: 'true'
          plugin-directory: .temp/plugin
          archive-name: codex-tools-${{ steps.pack.outputs.package-version }}.tar.gz
          dependency-policy: exclude-node-modules
          release-tag: v${{ steps.pack.outputs.package-version }}
      - name: Dry-run npm publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          dry-run: 'true'
          tarball: ${{ steps.pack.outputs.tarball-path }}
